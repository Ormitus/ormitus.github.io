<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo to PS1 — Ori Mor</title>
<meta name="description" content="Drop a photo and get it back as a low-poly PlayStation 1 picture.">
<meta name="theme-color" content="#090913">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@1,700&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  main { padding: 0 var(--gutter) 72px; max-width: 1280px; margin: 0 auto; }
  h1.title { margin: 28px 0 0; font-size: clamp(56px, 12vw, 168px); }
  .lede { max-width: 44ch; margin: 24px 0 0; font-size: 19px; color: var(--sub); text-wrap: pretty; }

  /* the drop zone is a little PS1 room: wall above, checker floor below */
  .drop {
    position: relative; overflow: hidden; display: grid; place-items: center; width: 100%; margin-top: 48px;
    min-height: clamp(260px, 36vw, 420px); padding: 24px; cursor: pointer; color: var(--ink); font: inherit; text-align: center;
    background: linear-gradient(#262657 0 58%, #1a1a3c 58% 100%);
  }
  .drop::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    background: conic-gradient(#6a2342 25%, #86304f 0 50%, #6a2342 0 75%, #86304f 0) 0 0 / 72px 72px; image-rendering: pixelated; }
  .drop > * { position: relative; }
  .drop .press { font-size: clamp(30px, 5.6vw, 76px); display: inline-flex; align-items: center; gap: .3em; flex-wrap: wrap; justify-content: center; }
  .drop .press .sym { width: .9em; height: .9em; }
  .drop small { display: block; margin-top: 18px; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  .drop:hover .title, body.over .drop .title { color: var(--red); }
  .drop:hover, body.over .drop { border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
  .drop[hidden] { display: none; }

  .stage { display: none; margin-top: 40px; gap: 24px; grid-template-columns: 1fr 1fr; align-items: start; }
  .stage.on { display: grid; }
  figure { margin: 0; display: grid; gap: 10px; }
  figcaption { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--sub); }
  .frame { position: relative; overflow: hidden; }
  .frame img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  #out { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; clip-path: inset(0 100% 0 0); }
  #out.in { clip-path: inset(0 0 0 0); transition: clip-path 1s steps(16, end); }
  .wait { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; padding: 20px; }
  .wait.off { display: none; }
  .wait .t { font-size: clamp(36px, 6vw, 80px); letter-spacing: .06em; line-height: 1; }
  .wait .n { font-size: 15px; color: var(--sub); max-width: 28ch; margin: 0 auto; }
  .blocks { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; width: min(320px, 80%); margin: 0 auto; }
  .blocks i { height: 14px; background: #2a2a58; animation: lit 2s steps(1) infinite; animation-delay: calc(var(--i) * 100ms); }
  @keyframes lit { 0%, 24% { background: var(--gold); } 25%, 100% { background: #2a2a58; } }

  .msg { margin: 24px 0 0; min-height: 1.5em; font-size: 17px; color: var(--sub); max-width: 70ch; white-space: pre-wrap; }
  .msg.err { color: #ff8a8f; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .actions[hidden] { display: none; }

  details { margin-top: 40px; max-width: 480px; padding: 6px 16px 14px; }
  summary { cursor: pointer; padding: 10px 0; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
  summary:hover { color: #fff; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 10px; font-size: 17px; }
  .opt input { width: 104px; height: 40px; padding: 0 10px; text-align: right; color: var(--gold); font-size: 17px; }
  .opt input:focus-visible { outline-offset: 2px; }
  @media (max-width: 768px) { .stage { grid-template-columns: 1fr; } }
</style>  <link rel="stylesheet" crossorigin href="./assets/ui-D12CuAk8.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="s-cross" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#1c2766" stroke="#6c8cff" stroke-width="2"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="#b8ccff" stroke-width="2.6" stroke-linecap="square" fill="none"/></symbol>
  <symbol id="s-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#4a1018" stroke="#ff5a63" stroke-width="2"/><circle cx="12" cy="12" r="5" stroke="#ffb3b8" stroke-width="2.6" fill="none"/></symbol>
  <symbol id="s-square" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#4a1a3c" stroke="#e58ac8" stroke-width="2"/><rect x="7.5" y="7.5" width="9" height="9" stroke="#f6c4e6" stroke-width="2.4" fill="none"/></symbol>
  <symbol id="s-tri" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#0f3a2c" stroke="#5fd9a8" stroke-width="2"/><path d="M12 6.5l5.2 9H6.8z" stroke="#b6f0d8" stroke-width="2.4" fill="none" stroke-linejoin="miter"/></symbol>
</svg>

<nav class="nav" aria-label="Main">
  <a class="logo" href="./"><svg class="sym" style="width:1.4em;height:1.4em" aria-hidden="true"><use href="#s-cross"/></svg>Photo to PS1</a>
  <ul class="nav-links">
    <li><a href="./" aria-current="page">Make</a></li>
    <li><a href="./studio/">Studio</a></li>
    <li><a href="https://ormitus.com">Ori Mor</a></li>
  </ul>
</nav>
<main>
  <h1 class="title">Photo<br>to PS1</h1>
  <p class="lede">Drop a photo. It comes back as a low-poly PlayStation picture: flat polygons, tiny textures, 15-bit colour.</p>

  <button class="drop bevel" id="drop" type="button">
    <span>
      <span class="title press">Press <svg class="sym" aria-hidden="true"><use href="#s-cross"/></svg> To Drop A Photo!</span>
      <small>or drag one here · JPG, PNG, WebP</small>
    </span>
  </button>
  <input id="file" type="file" accept="image/*" hidden>

  <section class="stage" id="stage" aria-label="Result">
    <figure><figcaption>Your photo</figcaption><div class="frame bevel in"><img id="src" alt="Your photo" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div></figure>
    <figure><figcaption>PS1</figcaption>
      <div class="frame bevel in" id="frame">
        <img id="out" alt="Your photo rebuilt as a PS1 render" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
        <div class="wait" id="wait"><div class="t tnum" id="clock">0:00</div><div class="blocks" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i></div><div class="n">Finding objects, building them in 3D, rendering small.</div></div>
      </div>
    </figure>
  </section>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="actions" id="actions" hidden>
    <a class="btn solid" id="dl" download="photo_ps1.png">Download PNG</a>
    <button class="btn" id="again" type="button">Run again</button>
    <button class="btn" id="other" type="button">Another photo</button>
  </div>

  <details class="bevel"><summary>Options</summary>
    <label class="opt">Objects rebuilt in 3D <input class="bevel in" id="objects" type="number" min="1" max="6" value="3"></label>
    <label class="opt">Polygons per object <input class="bevel in" id="faces" type="number" min="300" max="4000" step="100" value="1200"></label>
    <label class="opt">Pixel height (240 is PS1) <input class="bevel in" id="height" type="number" min="120" max="480" step="20" value="240"></label>
  </details>
</main>
<footer class="foot"><span>2026 Ori Mor</span><span>The 3D build runs on a local engine</span></footer>
<script>
const API = 'http://localhost:5184', $ = (id) => document.getElementById(id);
// The 3D build needs the local engine. Only talk to localhost when this page is itself served from localhost
// (a public page reaching into localhost would trigger a browser permission prompt for every visitor).
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
let current = null, timer = null, online = null;

// Online: hand the photo to the in-browser Studio through IndexedDB (an object URL would die with this page)
function handoff(file) {
  const open = indexedDB.open('ps1', 1);
  open.onupgradeneeded = () => open.result.createObjectStore('handoff');
  open.onsuccess = () => {
    const tx = open.result.transaction('handoff', 'readwrite');
    tx.objectStore('handoff').put(file, 'photo');
    tx.oncomplete = () => { location.href = './studio/?from=handoff'; };
  };
  open.onerror = () => { location.href = './studio/'; };
}
const say = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };
const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

async function ping() {
  if (!LOCAL) { online = false; return false; }
  try { const r = await fetch(API + '/health', { signal: AbortSignal.timeout(1500) }); online = r.ok; } catch { online = false; }
  if (!online) say('The 3D engine is not running on this computer. Start it with ./start.sh, or use the Studio, which runs in your browser.', true);
  return online;
}
if (LOCAL) ping(); else say('Dropping a photo here opens the Studio, which runs in your browser. The full 3D build (real models, rebuilt in Blender) needs a local engine and is not available online.');

$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => e.target.files[0] && go(e.target.files[0]);
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('over'); });
addEventListener('dragleave', () => document.body.classList.remove('over'));
addEventListener('drop', (e) => { e.preventDefault(); document.body.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) go(f); });
$('again').onclick = () => current && go(current);
$('other').onclick = () => { $('stage').classList.remove('on'); $('actions').hidden = true; $('drop').hidden = false; say(''); $('file').value = ''; };

async function go(file) {
  if (!LOCAL) return handoff(file);
  current = file; clearInterval(timer);
  $('src').onload = () => { $('frame').style.aspectRatio = `${$('src').naturalWidth} / ${$('src').naturalHeight}`; };
  $('src').src = URL.createObjectURL(file);
  $('out').classList.remove('in'); $('wait').classList.remove('off'); $('actions').hidden = true;
  $('stage').classList.add('on'); $('drop').hidden = true;
  if (!(await ping())) { $('wait').classList.add('off'); $('actions').hidden = false; $('dl').hidden = true; return; }
  $('dl').hidden = false; say('');
  const t0 = Date.now();
  timer = setInterval(() => { $('clock').textContent = clock(Math.round((Date.now() - t0) / 1000)); }, 500);
  $('clock').textContent = '0:00';
  try {
    const fd = new FormData();
    fd.append('image', file);
    for (const k of ['objects', 'faces', 'height']) fd.append(k, $(k).value);
    const r = await fetch(API + '/ps1', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.text()).slice(-500));
    const j = await r.json();
    await new Promise((res, rej) => { $('out').onload = res; $('out').onerror = rej; $('out').src = API + j.png; });
    $('dl').href = API + j.png;
    $('wait').classList.add('off'); requestAnimationFrame(() => $('out').classList.add('in'));
    say(`Done in ${Math.round((Date.now() - t0) / 1000)} seconds. Saved in ${j.blend.replace(/scene\.blend$/, '')}`);
  } catch (e) {
    $('wait').classList.add('off'); say('The build failed. ' + e.message + '\nTry again, or use fewer objects in Options.', true);
  } finally { clearInterval(timer); $('actions').hidden = false; }
}
</script></body></html>
