  :root{
    --bg:#0c0c0e; --surf:#141417; --surf2:#1b1b1f; --raise:#232329;
    --line:#212127; --line2:#2e2e36;
    --txt:#f2f2f3; --dim:#a1a1ac; --dim2:#6e6e7a; --hi:#f5f5f7;
    /* one accent, desaturated enough to sit beside 62 print inks rather than
       compete with them */
    --accent:#E0567F;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
    --ease:cubic-bezier(.16,1,.3,1); --fast:.18s;
    /* the panel is an instrument, not a terminal: mono is for numbers, where it
       stops values jittering as they change, and nothing else */
    --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  /* Viewport units, not height:100% — inside a frame that sizes itself to its
     content (as the artifact host does) a percentage height is circular and the
     whole grid collapses to nothing. dvh resolves against the frame's viewport. */
  html,body{margin:0;overflow:hidden;height:100vh;height:100dvh;min-height:460px}
  body{
    background:var(--bg);color:var(--txt);
    font:13px/1.45 "Heebo","Assistant",system-ui,sans-serif;
    display:grid;grid-template-columns:1fr 348px;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  /* numbers must not be re-ordered by the RTL bidi algorithm */
  .v,.seg small,#rect,[dir=ltr]{direction:ltr;unicode-bidi:isolate}

  /* ---------- stage ---------- */
  #stage{position:relative;display:grid;place-items:center;padding:26px;min-width:0;
    background:
      linear-gradient(45deg,#0e0e11 25%,transparent 25%,transparent 75%,#0e0e11 75%),
      linear-gradient(45deg,#0e0e11 25%,#0c0c0f 25%,#0c0c0f 75%,#0e0e11 75%);
    background-size:22px 22px;background-position:0 0,11px 11px}
  #board{position:relative;box-shadow:0 24px 70px -20px #000c,0 0 0 1px #ffffff12;
    transition:width var(--fast) var(--ease),height var(--fast) var(--ease)}
  #cv{display:block;width:100%;height:100%}
  #meta{position:absolute;inset-block-start:-21px;inset-inline-start:0;font-size:10.5px;color:var(--dim2);letter-spacing:.3px}
  #fps{position:absolute;inset-block-start:-21px;inset-inline-end:0;font-size:10.5px;color:var(--dim2)}
  #recdot{position:absolute;inset-block-end:10px;inset-inline-end:10px;display:none;align-items:center;gap:6px;
    background:#0009;padding:5px 10px;border-radius:99px;font-size:11px;backdrop-filter:blur(8px)}
  #recdot i{width:7px;height:7px;border-radius:99px;background:#ff4d4d;animation:blink 1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.15}}

  /* ---------- panel ---------- */
  #panel{background:var(--surf);border-inline-start:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
  #panel::-webkit-scrollbar{width:10px}
  #panel::-webkit-scrollbar-thumb{background:#2b2b34;border-radius:9px;border:3px solid var(--surf)}
  .head{padding:14px 15px 12px;border-block-end:1px solid var(--line);position:sticky;inset-block-start:0;background:var(--surf);z-index:5}
  .head h1{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.1px}
  .head p{margin:1px 0 11px;font-size:10.5px;color:var(--dim2)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--surf2);padding:3px;border-radius:9px;border:1px solid var(--line)}
  .seg button{background:none;border:none;color:var(--dim);padding:6px 4px;border-radius:6px;font:inherit;font-size:11.5px;cursor:pointer;transition:var(--fast) var(--ease)}
  .seg button small{display:block;font-size:9.5px;color:var(--dim2);margin-block-start:1px}
  .seg button[aria-pressed=true]{background:var(--hi);color:#101013;font-weight:600}
  .seg button[aria-pressed=true] small{color:#101013;opacity:.6}

  .looks{padding:11px 15px;border-block-end:1px solid var(--line);display:flex;gap:5px;flex-wrap:wrap}

  details.sec{border-block-end:1px solid var(--line)}
  details.sec>summary{list-style:none;cursor:pointer;padding:11px 15px;display:flex;align-items:center;gap:8px;
    transition:background var(--fast) var(--ease)}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary:hover{background:var(--surf2)}
  .sec .nm{font-weight:600;font-size:12.5px}
  .sec .sm{color:var(--dim2);font-size:10.5px;margin-inline-start:auto;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:end}
  .sec .chev{width:9px;height:9px;border-inline-end:1.5px solid var(--dim2);border-block-end:1.5px solid var(--dim2);
    transform:rotate(-45deg);transition:transform var(--fast) var(--ease);flex:0 0 auto}
  details[open].sec>summary .chev{transform:rotate(45deg)}
  .lk{background:none;border:none;padding:2px;cursor:pointer;color:var(--dim2);display:flex;flex:0 0 auto}
  .lk[aria-pressed=true]{color:var(--hi)}
  .body{padding:2px 15px 15px}

  .r{display:flex;align-items:center;gap:9px;min-height:27px}
  .r>label{flex:0 0 76px;color:var(--dim);font-size:11px;line-height:1.25}
  .r>input[type=range]{flex:1;min-width:0}
  .r .v{flex:0 0 40px;text-align:center;font-size:10.5px;color:var(--txt);background:#00000055;border-radius:5px;padding:2px 0}
  /* The stock control gives no value feedback on the track, so the fill is a
     gradient whose stop is written from JS. Firefox has ::-moz-range-progress
     and needs none of it. */
  input[type=range]{-webkit-appearance:none;appearance:none;height:20px;
    background:transparent;outline:none;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(to left,var(--accent) 0 var(--fill,0%),var(--line2) var(--fill,0%) 100%)}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line2)}
  input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}

<script>
/* ===========================================================================
   RISOKIT — the vocabulary every page on this site shares.

   Before this existed each page invented its own idea of what a colour was:
   the press held a real catalogue of 62 named Riso inks and 9 paper stocks,
   the gradient page held gradient stops, the poster page held flat arrays,
   and the compose and mosaic pages held nothing at all. The result was that
   14 of the poster page's 33 colours could not be printed by any Riso — the
   blue it used sat a distance of 90 from Lake, the nearest real ink.

   So: one catalogue, lifted out of the press at build time, and every page
   picks inks and paper from it rather than naming RGB.

   It also carries the two things that only become possible once every page
   speaks in inks — overprint prediction, and a recipe string that describes
   a design as data instead of pixels.

   build_site.py substitutes the catalogue in and puts this in every page head.
   =========================================================================== */
(function(global){
"use strict";

const RISO_INKS=[
 ["Black","#000000"],["Burgundy","#914E72"],["Blue","#0078BF"],["Green","#00A95C"],
 ["Medium Blue","#3255A4"],["Bright Red","#F15060"],["Federal Blue","#3D5588"],
 ["Purple","#765BA7"],["Teal","#00838A"],["Flat Gold","#BB8B41"],["Hunter Green","#407060"],
 ["Red","#FF665E"],["Brown","#925F52"],["Yellow","#FFE800"],["Marine Red","#D2515E"],
 ["Orange","#FF6C2F"],["Fluorescent Pink","#FF48B0"],["Light Gray","#88898A"],
 ["Metallic Gold","#AC936E"],["Crimson","#E45D50"],["Fluorescent Orange","#FF7477"],
 ["Cornflower","#62A8E5"],["Sky Blue","#0097DE"],["Sea Blue","#0074A2"],["Lake","#235BA8"],
 ["Indigo","#484D7A"],["Midnight","#435060"],["Mist","#D5E4C0"],["Granite","#A5AAA8"],
 ["Charcoal","#70747C"],["Smoky Teal","#5F8289"],["Steel","#375E77"],["Slate","#5E695E"],
 ["Turquoise","#00AAA0"],["Emerald","#19975D"],["Grass","#397E58"],["Spruce","#4A6941"],
 ["Moss","#68724D"],["Sea Foam","#62C2B1"],["Kelly Green","#67B346"],["Light Teal","#009DA5"],
 ["Ivy","#169B62"],["Pine","#237E74"],["Lagoon","#2F6165"],["Violet","#9D7AD2"],
 ["Orchid","#AE4A84"],["Raisin","#775D7A"],["Grape","#6C5D80"],["Scarlet","#F2484B"],
 ["Melon","#FFAE3B"],["Apricot","#F6A04D"],["Paprika","#EE7F4B"],["Pumpkin","#FF6F4C"],
 ["Bright Olive","#B49F29"],["Coral","#FF8D8F"],["Bubble Gum","#F984CA"],
 ["Light Lime","#E3ED55"],["Sunflower","#FFB511"],["Aqua","#5EC8E5"],
 ["Fluorescent Yellow","#FFE900"],["Fluorescent Red","#FF4C65"],["Fluorescent Green","#44D62C"]
];
const RISO_PAPERS=[
 ["Natural","#F2EDE1"],["Bright White","#F8F8F4"],["Ivory","#F5EFE0"],["Pale Yellow","#F4E9C4"],
 ["Pale Blue","#DCE6EE"],["Pale Pink","#F4DCE0"],["Grey","#CFCEC8"],["Kraft","#C9AC85"],
 ["Black","#1A1A1A"]
];

const INKS   = RISO_INKS.map(function(p){ return {name:p[0], hex:p[1].toUpperCase()}; });
const PAPERS = RISO_PAPERS.map(function(p){ return {name:p[0], hex:p[1].toUpperCase()}; });

const byHex = {};
INKS.forEach(function(k){ byHex[k.hex] = k; });

/* ------------------------------- colour ---------------------------------- */

function rgb(h){
  h = String(h).trim();
  if(h[0] === "#") h = h.slice(1);
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function hex(c){
  return "#" + c.map(function(v){
    v = Math.max(0, Math.min(255, Math.round(v)));
    return (v < 16 ? "0" : "") + v.toString(16);
  }).join("").toUpperCase();
}

/* sRGB <-> linear. Ink sits on paper in linear light; doing it in sRGB is what
   made the press's midtones muddy before it was fixed, and the same is true of
   every overprint prediction below. */
function toLin(v){ v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
function toSrgb(v){ v = v <= 0.0031308 ? v*12.92 : 1.055*Math.pow(v, 1/2.4) - 0.055; return v*255; }

/* Perceptual-ish distance. Not CIEDE2000 — a weighted Euclidean in sRGB, which
   is enough to rank "which real ink is this" and costs nothing. */
function dist(a, b){
  const x = rgb(a), y = rgb(b);
  const rm = (x[0] + y[0]) / 2;
  const dr = x[0]-y[0], dg = x[1]-y[1], db = x[2]-y[2];
  return Math.sqrt((2 + rm/256)*dr*dr + 4*dg*dg + (2 + (255-rm)/256)*db*db);
}

/* --------------------------- snapping to stock --------------------------- */

/** Nearest real ink to an arbitrary colour. */
function snapInk(h){
  let best = INKS[0], bd = Infinity;
  for(let i = 0; i < INKS.length; i++){
    let d = dist(h, INKS[i].hex);
    if(d < bd){ bd = d; best = INKS[i]; }
  }
  return {name:best.name, hex:best.hex, drift:bd, exact:bd < 1};
}

/** Nearest real paper stock. */
function snapPaper(h){
  let best = PAPERS[0], bd = Infinity;
  for(let i = 0; i < PAPERS.length; i++){
    let d = dist(h, PAPERS[i].hex);
    if(d < bd){ bd = d; best = PAPERS[i]; }
  }
  return {name:best.name, hex:best.hex, drift:bd, exact:bd < 1};
}

/** Snap a whole palette. Index 0 is treated as paper, the rest as inks —
    that is the convention every page here already follows. */
function snapPalette(pal){
  return pal.map(function(c, i){
    return i === 0 ? snapPaper(c) : snapInk(c);
  });
}

/* ------------------------------ overprint -------------------------------- */

/** What two inks actually make when one prints over the other.

    Riso ink is transparent and stacks multiplicatively — this is why the
    result of yellow over blue is a real green and not a blend of the two.
    `op` is the top drum's ink coverage, 0..1. */
function overprint(under, over, op){
  if(op == null) op = 0.92;
  let u = rgb(under).map(toLin), o = rgb(over).map(toLin);
  return hex(u.map(function(v, i){
    return toSrgb(v * (1 - op + op * o[i]));
  }));
}

/** Overprint the whole stack onto paper, in print order. */
function stack(paper, inks, op){
  return inks.reduce(function(acc, ink){ return overprint(acc, ink, op); }, paper);
}

function chroma(h){
  const c = rgb(h), mx = Math.max.apply(null, c), mn = Math.min.apply(null, c);
  return mx === 0 ? 0 : (mx - mn) / mx;
}
function hue(h){
  const [r, g, b] = rgb(h);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if(d === 0) return 0;
  const t = mx === r ? (g - b)/d + (g < b ? 6 : 0)
          : mx === g ? (b - r)/d + 2
          :            (r - g)/d + 4;
  return t * 60;
}
/** Shortest angular gap between two hues, 0..180. */
function hueGap(a, b){
  const d = Math.abs(hue(a) - hue(b)) % 360;
  return d > 180 ? 360 - d : d;
}
function lum(h){
  const c = rgb(h).map(toLin);
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}

/** How well two inks overprint, 0..1.

    Two failure modes, and they are different. A pair is muddy when the product
    is dark AND desaturated — that is the brown-grey nobody wants. A pair is
    wasted when the product is so close to the darker ink that the second pass
    bought nothing. Everything else is a real third colour, which is the whole
    reason to overprint at all.

    Black is exempt. A key plate is not a mixing partner: black over anything is
    black, by design and on purpose, and scoring it as "dark and grey" flagged
    every sane palette on the site as mud. Anything near-black is judged the
    same way — the question for a key is whether it prints clean, and it does. */
const KEY_LUM = 0.02;

function pairScore(a, b){
  if(lum(a) < KEY_LUM || lum(b) < KEY_LUM) return 1;

  const mix  = overprint(a, b, 0.92);
  const mud  = (1 - chroma(mix)) * (1 - lum(mix));       /* dark and grey */
  const gain = Math.min(1, dist(mix, lum(a) < lum(b) ? a : b) / 60);
  const sep  = Math.min(1, dist(a, b) / 120);
  const s    = (1 - mud) * (0.45 + 0.35*gain + 0.20*sep);
  return Math.max(0, Math.min(1, s));
}

/** Rank every catalogue ink as a partner for the inks already chosen.

    Scored on compatibility AND chroma together. Compatibility alone makes the
    ranking degenerate: black is exempt from the mud test, so it scores a
    perfect 1.00 against everything and wins every slot. Black is a fine ink and
    a bad suggestion — you reach for it deliberately, you do not need it
    proposed. Weighting by chroma keeps it available without letting it lead. */
function partners(chosen, n){
  const have = (chosen || []).map(c => snapInk(c).hex);
  const out  = INKS
    .filter(k => have.indexOf(k.hex) < 0)
    .map(k => {
      const fit = have.length
        ? have.reduce((m, h) => Math.min(m, pairScore(h, k.hex)), 1)
        : 1;
      /* Compatibility alone ties dozens of inks at 1.00 and chroma then breaks
         every tie the same way, so a suggested palette came out Blue, Green,
         Teal — one hue family wearing three names. Rewarding distance from the
         hues already picked is what makes the set span the wheel. */
      const spread = have.length
        ? have.reduce((m, h) => Math.min(m, hueGap(h, k.hex)), 180) / 180
        : 1;
      const interest = 0.25 + 0.75*chroma(k.hex);
      return {name:k.name, hex:k.hex, fit,
              score:fit * interest * (0.35 + 0.65*spread)};
    });
  out.sort((x, y) => y.score - x.score);
  return out.slice(0, n || 8);
}

/** Build a palette of n inks that all overprint well with one another. */
function suggest(n, paper){
  n = Math.max(1, n || 3);
  const pal = [snapPaper(paper || "#F2EDE1").hex];
  const picked = [];
  for(let i = 0; i < n; i++){
    const p = partners(picked, 1)[0];
    if(!p) break;
    picked.push(p.hex);
    pal.push(p.hex);
  }
  return pal;
}

/* ------------------------------- warnings -------------------------------- */

/** Things worth saying before the sheet is committed, not after.

    Every one of these is a condition that costs paper or ink on a real
    machine, so they are stated as facts about the press, never as taste. */
function review(pal, opts){
  opts = opts || {};
  let out = [];
  const snapped = snapPalette(pal);

  snapped.forEach(function(s, i){
    if(s.drift >= 20)
      out.push({level:"warn", where:i,
        msg:"הצבע " + pal[i].toUpperCase() + " לא קיים בקטלוג — הכי קרוב הוא "
            + s.name + " " + s.hex + " (מרחק " + Math.round(s.drift) + ")"});
  });

  const inks = snapped.slice(1).map(function(s){ return s.hex; });
  for(let a = 0; a < inks.length; a++){
    for(let b = a + 1; b < inks.length; b++){
      const sc = pairScore(inks[a], inks[b]);
      if(sc < 0.28)
        out.push({level:"warn", where:[a+1, b+1],
          msg:"הדפסת־על של " + byHex[inks[a]].name + " ו" + byHex[inks[b]].name
              + " נותנת " + overprint(inks[a], inks[b], .92) + " — בוץ. שקול זוג אחר."});
    }
  }

  if(inks.length > 4)
    out.push({level:"note", msg:inks.length + " דיו = " + inks.length
      + " מעברים במכונה. מעל 4, שגיאת הרג'יסטר מצטברת."});

  if(opts.opacity != null && opts.opacity > 0.9 && inks.length >= 3)
    out.push({level:"note",
      msg:"אטימות " + Math.round(opts.opacity*100) + "% על " + inks.length
          + " שכבות תרווה את הנייר — הדיו יימרח."});

  return out;
}

/* -------------------------------- recipe --------------------------------- */

/* A design as data. The alternative — and what the site did until now — is to
   ship the design as an encoded video, which is 100MB, lossy, and impossible
   to vary or reproduce. A recipe is a few dozen bytes and is exact. */

const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

function encodeRecipe(o){
  let payload = {
    v:1, p:o.page, s:o.seed|0, st:o.style || "",
    pal:(o.palette || []).map(function(c){
      const i = INKS.findIndex(function(k){ return k.hex === String(c).toUpperCase(); });
      return i >= 0 ? i : String(c).toUpperCase();
    }),
    pa:o.paper || "", t:o.text || "", k:o.params || {}
  };
  const json = JSON.stringify(payload);
  const bytes = new TextEncoder().encode(json);
  let bin = ""; bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

function decodeRecipe(str){
  let b = String(str).replace(/-/g,"+").replace(/_/g,"/");
  while(b.length % 4) b += "=";
  let bin = atob(b), bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  let o = JSON.parse(new TextDecoder().decode(bytes));
  return {
    version:o.v, page:o.p, seed:o.s, style:o.st,
    palette:(o.pal || []).map(function(c){
      return typeof c === "number" ? (INKS[c] ? INKS[c].hex : "#000000") : c;
    }),
    paper:o.pa, text:o.t, params:o.k || {}
  };
}

/* ------------------------------- handoff --------------------------------- */

/* The old handoff wrote one flat H.264 blob plus {kind, ext, seconds, w, h}.
   The press then ran colour separation to work out which pixels belonged to
   which drum — reconstructing, through compression artefacts, information the
   sending page had held exactly one navigation earlier.

   Now the sender may attach `separations`: one mask per ink, in print order,
   as blobs. When they are present the press skips separation entirely. When
   they are absent — an imported photo, say — it falls back to the old path,
   so nothing that worked before stops working. */

const DB = "risomitus", STORE = "handoff";

const open = () => new Promise((res, rej) => {
  const r = indexedDB.open(DB, 1);
  r.onupgradeneeded = () => {
    if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE);
  };
  r.onsuccess = () => res(r.result);
  r.onerror   = () => rej(r.error);
});

const put = (db, key, val) => new Promise((res, rej) => {
  const tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).put(val, key);
  tx.oncomplete = () => res();
  tx.onerror    = () => rej(tx.error);
});

const get = (db, key) => new Promise((res, rej) => {
  const tx = db.transaction(STORE, "readonly");
  const q  = tx.objectStore(STORE).get(key);
  q.onsuccess = () => res(q.result);
  q.onerror   = () => rej(q.error);
});

/** Send a sheet to the press.
    o = {blob, ext, seconds, w, h, page, palette, paper, seed, style, text,
         params, separations?} */
async function send(o){
  const db = await open();
  const seps = o.separations || [];
  const meta = {
    kind:o.kind || "video", ext:o.ext, seconds:o.seconds, w:o.w, h:o.h,
    /* everything below is new, and everything below is what the press
       previously had to guess at */
    page:o.page || "", palette:o.palette || [], paper:o.paper || "",
    seed:o.seed|0, style:o.style || "", text:o.text || "",
    params:o.params || {},
    layered:seps.length > 0,
    layers:seps.map(s => ({
      ink:s.ink, name:s.name || (byHex[s.ink] && byHex[s.ink].name) || "", op:s.op
    })),
    recipe:encodeRecipe(o)
  };
  await Promise.all([
    put(db, "sheet", o.blob),
    put(db, "meta", meta),
    ...seps.map((s, i) => put(db, "sep" + i, s.blob))
  ]);
}

/** Read a sheet on the press side. Returns {blob, meta, separations[]}. */
async function receive(){
  const db = await open();
  const [blob, raw] = await Promise.all([get(db, "sheet"), get(db, "meta")]);
  const meta = raw || {};
  if(!meta.layered) return {blob, meta, separations:[]};

  const layers = meta.layers || [];
  const blobs  = await Promise.all(layers.map((_, i) => get(db, "sep" + i)));
  const separations = layers
    .map((l, i) => ({ink:l.ink, name:l.name, op:l.op, blob:blobs[i]}))
    .filter(s => !!s.blob);
  return {blob, meta, separations};
}

/* --------------------------------- out ----------------------------------- */

global.RISOKIT = {
  INKS:INKS, PAPERS:PAPERS,
  rgb:rgb, hex:hex, dist:dist, chroma:chroma, lum:lum, hue:hue, hueGap:hueGap,

  send:send, receive:receive,

};

})(window);

    if(n>1) j = Math.round(Math.floor(j/NL*n)/(n-1)*(NL-1));
    const L=LAB[j*3], a=LAB[j*3+1], b=LAB[j*3+2];
    const rgb = lab2rgb(Math.max(0,Math.min(1.1,L*c.light)), (a*co-b*si)*c.sat, (a*si+b*co)*c.sat);
    CS[i] = rgb[0]+","+rgb[1]+","+rgb[2];
    if(i===0) RGB0=rgb; if(i===NL-1) RGB1=rgb;
  }
}
/** Paint the filled part of every slider.

    Chrome exposes no track pseudo-element that knows the value, so the fill has
    to be a gradient stop written from here. Delegated once at the document
    level rather than bound per control, because this panel rebuilds its
    controls whenever a section opens. */
function fills(root){
  for(const el of (root||document).querySelectorAll('input[type=range]')){
    const lo=+el.min||0, hi=+el.max||100;
    el.style.setProperty('--fill',(100*((+el.value-lo)/((hi-lo)||1)))+'%');
  }
}
document.addEventListener('input',e=>{
  if(e.target&&e.target.type==='range') fills(e.target.parentNode||document);
},true);
new MutationObserver(()=>fills()).observe(document.documentElement,
  {childList:true,subtree:true});

function paintRamp(){
  const el=document.getElementById("ramp"); if(!el) return;
  const p=[]; for(let i=0;i<=32;i++) p.push(`rgb(${CS[Math.round(i/32*(NL-1))]}) ${i/32*100}%`);
  el.style.background = `linear-gradient(90deg,${p.join(",")})`;
  paintInks();
}

/** Name the real inks that would print this ramp.

    Deliberately a readout and not a mode. On the poster page RISOKIT snaps the
    palette to stock, which is right there because those are flat plates of ink.
    Here the palettes are continuous ramps — several of them sampled off
    photographic gradients — and snapping a ramp to 62 discrete inks does not
    make it printable, it destroys it. What is useful is knowing what to ask a
    print shop for once the screen version is settled, so that is all this does.

    Reported as the four inks the ramp spends most of its length nearest to,
    which is a better answer than the nearest ink to each stop: a ramp can pass
    briefly through a colour it never really occupies. */
function paintInks(){
  const el=document.getElementById("inkline");
  if(!el || !window.RISOKIT) return;
  const tally=new Map();
  for(let i=0;i<NL;i+=Math.max(1,NL>>6)){
    const hex="#"+CS[i].split(",")
      .map(v=>(+v).toString(16).padStart(2,"0")).join("");
    const k=RISOKIT.snapInk(hex);
    tally.set(k.hex,(tally.get(k.hex)||0)+1);
  }
  const top=[...tally.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4);
  const total=[...tally.values()].reduce((a,b)=>a+b,0);
  el.innerHTML=top.map(([hex,n])=>
    '<span><i style="background:'+hex+'"></i>'+(RISOKIT.nameOf(hex)||hex)
    +'<b>'+Math.round(100*n/total)+'%</b></span>').join("");
}

/* ═══════════════════════════════════════════════════════════════════
   4. FIELDS — 9 engines, all periodic in t (period = 1 cycle)
   ═══════════════════════════════════════════════════════════════════ */
const fract = x => x - Math.floor(x);
function h2(x,y){                            // Math.imul: a plain * overflows 2^53 and kills the distribution
  let n = (Math.imul(x|0,374761393) + Math.imul(y|0,668265263)) | 0;
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967296;
}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=h2(xi,yi), b=h2(xi+1,yi), c=h2(xi,yi+1), d=h2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
const fbm = (x,y) => vnoise(x,y)*.55 + vnoise(x*2.1+9.2,y*2.1-3.7)*.28 + vnoise(x*4.3-5.1,y*4.3+1.9)*.17;
/* looping noise: the sample point walks a circle in t, so f(t+1) === f(t) */
function lnoise(x,y,t,r){ const a=t*Math.PI*2; return fbm(x+Math.cos(a)*r, y+Math.sin(a)*r); }
const ctr = v => Math.max(0,Math.min(1,.5+(v-.5)*1.75));

function field(nx,ny,t){
  const m=M(), s=m.scale;
  let x=nx-m.cx, y=ny-m.cy;
  if(m.warp>0){
    const k=m.warpScale, a=t*Math.PI*2;
    x += Math.sin(y*3.1*k + a)*.28*m.warp;
    y += Math.cos(x*2.7*k - a)*.28*m.warp;
  }
  let v;
  switch(m.engine){
    case "scroll":{ const a=m.angle*Math.PI/180; v=fract((x*Math.cos(a)+y*Math.sin(a))*.5*s + t); break; }
    case "pulse":  v=fract(Math.hypot(x,y)*.8*s - t); break;
    case "swirl":{ const a=m.angle*Math.PI/180;
                   v=fract((Math.atan2(y,x)-a)/(Math.PI*2)*s + Math.hypot(x,y)*m.twist + t); break; }
    case "spiral": v=fract((Math.atan2(y,x))/(Math.PI*2)*Math.round(m.arms) + Math.hypot(x,y)*.8*s + t); break;
    case "ripple": v=.5+.5*Math.sin(Math.hypot(x,y)*Math.round(m.count)*s*2.4 - t*Math.PI*2); break;
    /* phase multipliers MUST be integers, or the sum's period is lcm(1,1/.8,1/.5)=5
       cycles and the "one full loop" export jumps. Verified: maxDelta(t,t+1)=0. */
    case "breathe":{ const A=t*Math.PI*2, r=m.ratio;
                     v=(Math.sin(x*2.2*s+A)+Math.sin(y*1.7*s*r-A)+Math.sin((x+y)*1.3*s+A*2))/3;
                     v=Math.max(0,Math.min(1,.5+v*.7)); break; }
    case "drift":  v=ctr(lnoise(x*1.15*s, y*1.15*s, t, .55+m.turb)); break;
    case "aurora":{ const wx=lnoise(x*.6*s,y*.6*s,t,1.1)*2-1, wy=lnoise(x*.6*s+5.3,y*.6*s-2.1,t,1.1)*2-1;
                    v=ctr(lnoise(x*1.1*s+wx*m.turb, y*1.1*s+wy*m.turb, t, .8)); break; }
    case "metronome":{ const a=m.angle*Math.PI/180, tt=1-Math.abs(fract(t)*2-1);
                       v=fract((x*Math.cos(a)+y*Math.sin(a))*.5*s + tt); break; }
    default: v=0;
  }
  switch(m.shape){                                   /* value-shaping curve */
    case "smooth": v=v*v*(3-2*v); break;
    case "mirror": v=1-Math.abs(v*2-1); break;
    case "steps":{ const n=Math.max(2,Math.round(m.shapeAmt)); v=Math.floor(v*n)/(n-1); break; }
    case "gamma":  v=Math.pow(v, Math.max(.15, m.shapeAmt/6)); break;
  }
  return v<0?0 : v>1?1 : v;
}
function field2(nx,ny,t){                            /* independent mask field */
  const k=MK();                                      /* s2speed is integer-only: keeps the loop closed */
  return ctr(lnoise(nx*1.2*k.s2scale, ny*1.2*k.s2scale, t*Math.round(k.s2speed), .9));
}
const smoothstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
const loopSecs = () => M().speed===0 ? 0 : 1/Math.abs(M().speed);

/* ═══════════════════════════════════════════════════════════════════
   5. CANVAS + LAYOUT
   ═══════════════════════════════════════════════════════════════════ */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const wc=document.createElement("canvas"), wx=wc.getContext("2d");
const board=document.getElementById("board"), stage=document.getElementById("stage");
let RW=1080, RH=1350, K=1, layoutDirty=true, lkey="";
let L={ch:[],x:[],y:[],row:[],n:0,unitW:1};
let GRAIN=[], vgrad=null;

function fitBoard(){
  const f=FORMATS[ST.format], pad=52;
  const aw=stage.clientWidth-pad, ah=stage.clientHeight-pad;
  const sc=Math.min(aw/f.w, ah/f.h);
  board.style.width  = Math.max(80,Math.floor(f.w*sc))+"px";
  board.style.height = Math.max(80,Math.floor(f.h*sc))+"px";
}
function setupCanvases(){
  const f=FORMATS[ST.format];
  // canvas dimensions truncate to integers; keep RW/RH equal to the real buffer or the
  // layout maths drifts by a sub-pixel against what is actually drawn
  RW=Math.round(f.w*K); RH=Math.round(f.h*K);
  cv.width=RW; cv.height=RH; wc.width=RW; wc.height=RH;
  vgrad=null; layoutDirty=true; fitBoard();
}
new ResizeObserver(fitBoard).observe(stage);

const RTL=/[֐-׿؀-ۿ]/;
function visual(word){ const a=[...word]; return RTL.test(word) ? a.reverse() : a; }

function layout(){
  const t=T(), px=t.size*K, tr=t.tracking*t.spacing*K;
  const inset=CP().margin*Math.min(RW,RH);
  const x0=inset, y0=inset, w=RW-inset*2, h=RH-inset*2;
  wx.font=`${t.weight} ${px}px ${t.font}, sans-serif`;
  wx.textBaseline="alphabetic"; wx.textAlign="left"; wx.direction="ltr";

  const mk = word => { const cs=visual((word||" ")+" "); return {cs, ws:cs.map(c=>wx.measureText(c).width+tr)}; };
  const A=mk(t.word), B=t.altMode!=="off" && t.alt ? mk(t.alt) : A;
  const uA=A.ws.reduce((a,b)=>a+b,0)||px;
  const lineH=Math.max(3, px*t.lineGap*t.spacing);
  const rows=Math.ceil(h/lineH)+1;

  L={ch:[],x:[],y:[],row:[],n:0,unitW:uA};
  for(let r=0;r<rows;r++){
    const useB = t.altMode==="alt" ? r%2===1 : t.altMode==="rand" ? h2(r,91)>.5 : false;
    const U = useB ? B : A, unit = U.ws.reduce((a,b)=>a+b,0)||px;
    const jit = t.jitter ? (h2(r,7)-.5)*t.jitter*lineH*.7 : 0;
    const y = y0 + r*lineH + px*.8 + jit;
    let x = x0 - unit + ((r*t.stagger*unit) % unit);
    while(x < x0+w+unit){
      for(let i=0;i<U.cs.length;i++){
        const cw=U.ws[i];
        if(x+cw > x0-px && x < x0+w+px && U.cs[i].trim()){
          L.ch.push(U.cs[i]); L.x.push(x); L.y.push(y); L.row.push(r); L.n++;
        }
        x += cw;
      }
    }
  }
  layoutDirty=false;
}
function layoutKey(){
  const t=T();
  return [ST.format,K,t.word,t.alt,t.altMode,t.font,t.size,t.weight,t.tracking,t.lineGap,
          t.stagger,t.spacing,t.jitter,CP().margin].join("|");
}

function makeGrain(){
  GRAIN=[];
  const img=new Image();
  img.onload=()=>{
    GRAIN=[];
    /* four frames from one tile: the same grain shifted and flipped, so the
       animation still crawls without carrying four separate tiles */
    for(let k=0;k<4;k++){
      const N=img.width;
      const c=document.createElement("canvas"); c.width=c.height=N;
      const g=c.getContext("2d");
      g.save();
      if(k&1){ g.translate(N,0); g.scale(-1,1); }
      if(k&2){ g.translate(0,N); g.scale(1,-1); }
      g.drawImage(img,0,0);
      g.restore();
      GRAIN.push(c);
    }
  };
  img.onerror=()=>{
    /* if the tile ever fails to decode, fall back to the old noise rather than
       dropping grain silently */
    GRAIN=[];
    for(let k=0;k<4;k++){
      const c=document.createElement("canvas"); c.width=c.height=110;
      const g=c.getContext("2d"), d=g.createImageData(110,110);
      for(let i=0;i<d.data.length;i+=4){
        const v=200+Math.random()*55|0;
        d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=Math.random()*255|0;
      }
      g.putImageData(d,0,0); GRAIN.push(c);
    }
  };
  img.src=GRAIN_TILE;
}
makeGrain();

/* ═══════════════════════════════════════════════════════════════════
   6. RENDER
   ═══════════════════════════════════════════════════════════════════ */
let playing=!matchMedia("(prefers-reduced-motion:reduce)").matches;
let clock=0, last=performance.now(), fps=60, frame=0, exporting=false;

/* The background is driven by the same clock and the same motion speed as the type, so
   it drifts with the pattern instead of sitting still behind it. In ramp mode the whole
   palette scrolls through the sheet; in two-colour mode the axis rotates and breathes.
   A handful of colour stops — the cost does not depend on the glyph count. */
function drawBg(g,t){
  const cp=CP(), mv=cp.bgMotion||0, sp=M().speed||0;
  if(cp.bgMode==="gradient" || cp.bgMode==="ramp"){
    const spin = mv*sp*t*Math.PI*2*0.25;
    const a=cp.bgAngle*Math.PI/180 + spin, r=Math.hypot(RW,RH)/2;
    const gr=g.createLinearGradient(RW/2-Math.cos(a)*r, RH/2-Math.sin(a)*r,
                                    RW/2+Math.cos(a)*r, RH/2+Math.sin(a)*r);
    if(cp.bgMode==="ramp"){
      const off = mv*sp*t, N=8;
      for(let i=0;i<=N;i++){
        const p=i/N;
        let q=(p+off)%1; if(q<0) q+=1;
        gr.addColorStop(p, "rgb("+CS[Math.min(NL-1,(q*(NL-1))|0)]+")");
      }
    } else {
      // the two stops slide past each other rather than staying pinned to the corners
      const w = mv ? (Math.sin(t*sp*Math.PI*2)*.5+.5)*.35*mv : 0;
      gr.addColorStop(0, cp.bg1);
      gr.addColorStop(Math.max(.001,Math.min(.999,.5+w-.25)), cp.bg2);
      gr.addColorStop(1, cp.bg1);
    }
    g.fillStyle=gr;
  } else g.fillStyle=cp.bg1;
  g.fillRect(0,0,RW,RH);
}

function drawFrame(t){
  if(layoutDirty || lkey!==layoutKey()){ lkey=layoutKey(); layout(); }
  refreshColors(t);
  const ma=MA(), mk=MK(), cp=CP(), tp=T();

  /* --- work layer: background (+ trail) + glyphs --- */
  wx.globalCompositeOperation="source-over";
  if(ma.trail>0){ wx.globalAlpha=1-ma.trail; drawBg(wx,t); wx.globalAlpha=1; } else drawBg(wx,t);

  const inset=cp.margin*Math.min(RW,RH);
  if(inset>0){ wx.save(); wx.beginPath(); wx.rect(inset,inset,RW-inset*2,RH-inset*2); wx.clip(); }

  const px=tp.size*K;
  wx.font=`${tp.weight} ${px}px ${tp.font}, sans-serif`;
  wx.textBaseline="alphabetic"; wx.textAlign="left"; wx.direction="ltr";
  wx.globalCompositeOperation=ma.blend;
  wx.lineWidth=ma.stroke*K;
  /* A canvas shadow is applied per draw call, so glow used to cost a blur on every one
     of a few thousand glyphs — measured at 3.5x the frame time. The text layer is already
     drawn to its own canvas, so the glow is now one blurred composite of that whole layer:
     the cost stops depending on how many glyphs there are. */
  wx.shadowBlur = 0;
  wx.shadowColor = "transparent";

  const layers=Math.max(1,Math.round(ma.layers)), dk=Math.round(ma.depth*3);
  const outline = ma.style==="outline", duo = ma.style==="duo", mis = ma.style==="misprint";
  const misX = mis ? ma.misprint*.09*px : 0, misY = mis ? ma.misprint*.05*px : 0;
  const cxp=RW/2, cyp=RH/2, inv=2/RH;
  let cur="", curRow=-1, tRow=t, aRow=1, xoff=0, rOut=false;

  for(let i=0;i<L.n;i++){
    const row=L.row[i];
    if(row!==curRow){                            /* per-row layer state (parallax + depth) */
      curRow=row;
      const lay = layers>1 ? row%layers : 0;
      tRow = t + lay*ma.depth*.22;
      aRow = ma.alpha*(1 - lay*ma.depth*.3);
      xoff = dk ? fract(tRow*dk*(lay%2?-1:1))*L.unitW : 0;
      rOut = duo ? row%2===1 : outline;
    }
    const x=L.x[i]+xoff, y=L.y[i];
    const nx=(x-cxp)*inv, ny=(y-cyp)*inv;
    const v=field(nx,ny,tRow);
    let idx=(v*(NL-1))|0; idx = idx<0?0 : idx>NL-1?NL-1 : idx;
    let a=aRow, sc=1;

    if(mk.on){
      let mv = mk.src==="second" ? field2(nx,ny,tRow)
             : mk.src==="vignette" ? 1-Math.min(1,Math.hypot(nx,ny)/1.25)
             : mk.src==="linear" ? (ny+1)/2 : v;
      if(mk.band) mv = 1-Math.abs(mv-mk.threshold)*2/Math.max(.02,mk.softness*2);
      let m = mk.band ? Math.max(0,Math.min(1,mv))
                      : smoothstep(mk.threshold-mk.softness, mk.threshold+mk.softness, mv);
      if(mk.invert) m=1-m;
      a *= mk.floor+(1-mk.floor)*m;
      if(mk.sizeMod>0) sc = 1-mk.sizeMod*(1-m);
      if(a<=.004) continue;
    }
    // a mask gives every glyph its own alpha, which missed the style cache on every
    // glyph and allocated a string each time; 1/64 steps are indistinguishable
    const aq = a<.999 ? (Math.round(a*64)/64) : 1;
    const st = aq<.999 ? "rgba("+CS[idx]+","+aq+")" : "rgb("+CS[idx]+")";
    if(st!==cur){ cur=st; wx.fillStyle=st; wx.strokeStyle=st; if(ma.glowMode==="self"&&ma.glow>0) wx.shadowColor=st; }

    if(sc!==1){
      wx.save(); wx.translate(x,y); wx.scale(sc,sc);
      rOut ? wx.strokeText(L.ch[i],0,0) : wx.fillText(L.ch[i],0,0);
      wx.restore(); cur="";                       /* restore() reverts fillStyle — drop the cache */
    } else if(mis){
      const j=(NL-1)-idx;
      wx.fillStyle="rgba("+CS[j]+","+(a*.85).toFixed(3)+")";
      wx.fillText(L.ch[i], x-misX, y-misY);
      wx.fillStyle=st; wx.fillText(L.ch[i], x+misX, y+misY);
      cur="";
    } else rOut ? wx.strokeText(L.ch[i],x,y) : wx.fillText(L.ch[i],x,y);
  }
  if(inset>0) wx.restore();
  wx.globalCompositeOperation="source-over"; wx.shadowBlur=0;

  /* --- finish layer: composite + grain + vignette + guides --- */
  ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
  if(ma.glow>0){
    ctx.save();
    ctx.filter="blur("+(ma.glow*K*0.9).toFixed(1)+"px)";
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=Math.min(1,.35+ma.glow/28);
    if(ma.glowMode==="white"){ ctx.drawImage(wc,0,0); }
    else ctx.drawImage(wc,0,0);
    ctx.restore();
  }
  ctx.drawImage(wc,0,0);

  /* GRAIN fills in when the tile decodes, so the first frames can arrive before
     it exists — createPattern(undefined) throws and would take the render loop
     down with it */
  if(cp.grain>0 && GRAIN.length){
    const g=GRAIN[(frame>>1)&GRAIN.length-1];
    ctx.save(); ctx.globalAlpha=cp.grain*.5; ctx.globalCompositeOperation="overlay";
    const p=ctx.createPattern(g,"repeat"); ctx.fillStyle=p; ctx.fillRect(0,0,RW,RH); ctx.restore();
  }
  if(cp.vignette>0){
    if(!vgrad){ vgrad=ctx.createRadialGradient(RW/2,RH/2,Math.min(RW,RH)*.28,RW/2,RH/2,Math.hypot(RW,RH)*.62);
      vgrad.addColorStop(0,"rgba(0,0,0,0)"); vgrad.addColorStop(1,"rgba(0,0,0,1)"); }
    ctx.save(); ctx.globalAlpha=cp.vignette; ctx.fillStyle=vgrad; ctx.fillRect(0,0,RW,RH); ctx.restore();
  }
  if(cp.guides && !exporting) drawGuides();
  frame++;
}
function drawGuides(){
  const f=ST.format, u=RW/1080;
  ctx.save(); ctx.strokeStyle="rgba(120,200,255,.55)"; ctx.lineWidth=Math.max(1,1.5*u); ctx.setLineDash([9*u,7*u]);
  const box=(x,y,w,h)=>ctx.strokeRect(x,y,w,h);
  if(f==="story"){ box(0,250*u,RW,RH-250*u-340*u);                       /* IG story chrome */
    ctx.fillStyle="rgba(120,200,255,.07)"; ctx.fillRect(0,0,RW,250*u); ctx.fillRect(0,RH-340*u,RW,340*u); }
  else box(RW*.05,RH*.05,RW*.9,RH*.9);
  ctx.setLineDash([]); ctx.strokeStyle="rgba(120,200,255,.25)";
  ctx.beginPath(); ctx.moveTo(RW/2,0); ctx.lineTo(RW/2,RH); ctx.moveTo(0,RH/2); ctx.lineTo(RW,RH/2); ctx.stroke();
  ctx.restore();
}

/* Every numeric token lives in its own dir=ltr span: an RTL paragraph would otherwise
   re-order "1080×1350" and "7.1s" on screen. Spans are built once, not per frame. */
const meta=document.getElementById("meta"), fpsEl=document.getElementById("fps");
meta.innerHTML = `<span dir="ltr" id="m_size"></span> · <span dir="ltr" id="m_n"></span> תווים · לופ <span dir="ltr" id="m_loop"></span>`;
fpsEl.innerHTML = `<span dir="ltr" id="m_fps"></span><span id="m_pause"></span>`;
const mSize=document.getElementById("m_size"), mN=document.getElementById("m_n"),
      mLoop=document.getElementById("m_loop"), mFps=document.getElementById("m_fps"),
      mPause=document.getElementById("m_pause");
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(playing) clock += dt*M().speed;
  drawFrame(clock);
  fps += ((1/Math.max(dt,1e-4))-fps)*.07;
  const ls=loopSecs();
  mSize.textContent=`${RW}×${RH}`; mN.textContent=L.n;
  mLoop.textContent = ls ? ls.toFixed(1)+"s" : "—";
  mFps.textContent = `${fps.toFixed(0)} fps`;
  mPause.textContent = playing ? "" : " · מושהה";
}
requestAnimationFrame(loop);

let userFontN=0, fontMsg=null;
async function loadFontFile(file){
  if(!file) return;
  if(!/\.(ttf|otf|woff2?)$/i.test(file.name)) throw new Error("פורמט לא נתמך");
  const buf=await file.arrayBuffer();
  const fam="גופן"+(++userFontN);
  const ff=new FontFace(fam,buf);
  await ff.load();                                  // throws on a malformed file
  document.fonts.add(ff);
  const label=file.name.replace(/\.[^.]+$/,"").slice(0,22);
  FONTS.push([`"${fam}"`,label]);
  const sel=document.getElementById("c_type_font");
  if(sel){ const o=document.createElement("option"); o.value=`"${fam}"`; o.textContent=label;
           sel.appendChild(o); sel.value=`"${fam}"`; }
  T().font=`"${fam}"`; layoutDirty=true; lkey="";
  if(fontMsg) fontMsg.textContent=label;
  syncAll(); saveDebounced();
  return label;
}

function control(c){
  const row=document.createElement("div"); row.className="r";
  const id="c_"+c.p.replace(/\./g,"_")+(c.t==="upload"?"_up":"");
  const lab=document.createElement("label"); lab.textContent=c.l; lab.htmlFor=id; row.appendChild(lab);

  if(c.t==="upload"){                               /* file picker — no state to sync back */
    const b=document.createElement("button"); b.className="b"; b.type="button"; b.id=id;
    b.style.flex="1"; b.innerHTML=svg("down")+"בחר קובץ";
    const fi=document.createElement("input"); fi.type="file"; fi.accept=".ttf,.otf,.woff,.woff2";
    fi.hidden=true; fi.setAttribute("aria-label","העלאת קובץ גופן");
    b.onclick=()=>fi.click();
    fi.onchange=async()=>{
      b.innerHTML="טוען…";
      try{ const n=await loadFontFile(fi.files[0]); b.innerHTML=svg("down")+(n||"בחר קובץ"); }
      catch(err){ b.innerHTML="נכשל: "+err.message;
                  setTimeout(()=>b.innerHTML=svg("down")+"בחר קובץ",2200); }
      fi.value="";
    };
    row.append(b,fi); fontMsg=null;
    return row;
  }
  let el, vv=null;
  const val = () => getp(c.p);
  if(c.t==="r"){
    el=document.createElement("input"); el.type="range"; el.min=c.min; el.max=c.max; el.step=c.step;
    vv=document.createElement("span"); vv.className="v mono";
  } else if(c.t==="s"){
    el=document.createElement("select");
    for(const [v,l] of c.o){ const o=document.createElement("option"); o.value=v; o.textContent=l; el.appendChild(o); }
  } else if(c.t==="c"){ el=document.createElement("input"); el.type="checkbox"; el.style.marginInlineStart="auto"; }
  else if(c.t==="col"){ el=document.createElement("input"); el.type="color"; el.style.marginInlineStart="auto"; }
  else { el=document.createElement("input"); el.type="text"; }
  el.id=id; el.setAttribute("aria-label",c.l);
  row.appendChild(el); if(vv) row.appendChild(vv);

  const push = () => {
    let v = c.t==="c" ? el.checked : c.t==="r" ? parseFloat(el.value) : el.value;
    if(c.nu) v=parseFloat(v);
    setp(c.p,v);
    if(vv) vv.textContent=num(v);
    if(c.re || c.p==="color.space" || c.p==="color.cyclic") buildRamp();
    if(c.p.startsWith("type.")||c.p==="comp.margin") layoutDirty=true;
    if(c.p==="comp.vignette") vgrad=null;
    ckey=""; refreshSummaries(); toggleVis();
  };
  el.addEventListener(c.t==="r"?"input":c.t==="text"?"input":"change", push);

  const sync = () => {
    const v=val();
    if(c.t==="c") el.checked=!!v; else el.value=v;
    if(vv) vv.textContent=num(v);
  };
  bound.push({row,c,sync});
  return row;
}
function toggleVis(){ for(const b of bound) if(b.c.when) b.row.style.display = b.c.when()?"flex":"none"; }
function syncAll(){ for(const b of bound) b.sync(); toggleVis(); refreshSummaries(); }

function labeled(txt){ const d=document.createElement("div"); d.className="lab"; d.textContent=txt; return d; }

  sm.appendChild(lk); d.appendChild(sm);

  const body=document.createElement("div"); body.className="body";
  if(s.presets){
    body.appendChild(labeled(s.id==="color"?"פלטות":"אריגות"));
    const ch=document.createElement("div"); ch.className="chips";
    Object.keys(s.presets).forEach(k=>{
      const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=k;
      b.setAttribute("aria-pressed","false");
      b.onclick=()=>{
        if(s.id==="color"){ C().stops=s.presets[k].map(x=>({...x})); buildRamp(); renderStops(); }
        else { patch(T(), s.presets[k]); layoutDirty=true; }
        [...ch.children].forEach(c=>c.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true"); syncAll();
      };
      ch.appendChild(b);

    body.appendChild(ch);

  if(s.custom==="stops"){
    const r=document.createElement("div"); r.id="ramp"; body.appendChild(r);
    const il=document.createElement("div"); il.id="inkline"; body.appendChild(il);
    const st=document.createElement("div"); st.id="stops"; body.appendChild(st);
    const g=document.createElement("div"); g.className="grid2";
    const add=document.createElement("button"); add.className="b"; add.type="button"; add.textContent="הוסף עצירה";
    add.onclick=()=>{ C().stops.push({p:+Math.random().toFixed(2),c:randHex()}); buildRamp(); renderStops(); };
    const srt=document.createElement("button"); srt.className="b"; srt.type="button"; srt.textContent="פרוס שווה";
    srt.onclick=()=>{ const a=C().stops.slice().sort((x,y)=>x.p-y.p);
      a.forEach((x,i)=>x.p=+(i/(a.length-1||1)).toFixed(3)); C().stops=a; buildRamp(); renderStops(); };
    g.append(add,srt); body.appendChild(g);
  }
  if(s.macro.length){ body.appendChild(labeled("ראשי")); s.macro.forEach(c=>body.appendChild(control(c))); }
  if(s.det.length){ body.appendChild(labeled("פירוט")); s.det.forEach(c=>body.appendChild(control(c))); }
  d.appendChild(body); secWrap.appendChild(d);
});

function refreshSummaries(){ SEC.forEach(s=>{
  const el=secWrap.querySelector(`[data-sum="${s.id}"]`); if(el) el.textContent=s.sum(); }); }

function renderStops(){
  const box=document.getElementById("stops"); if(!box) return;
  box.innerHTML="";
  C().stops.forEach((st,i)=>{
    const r=document.createElement("div"); r.className="stop";
    const col=document.createElement("input"); col.type="color"; col.value=st.c; col.setAttribute("aria-label","צבע עצירה "+(i+1));
    const pos=document.createElement("input"); pos.type="range"; pos.min=0; pos.max=1; pos.step=.01; pos.value=st.p;
    pos.setAttribute("aria-label","מקום עצירה "+(i+1));
    const x=document.createElement("button"); x.className="x"; x.type="button"; x.innerHTML=svg("x"); x.title="מחק";
    col.oninput=()=>{st.c=col.value; buildRamp();};
    pos.oninput=()=>{st.p=parseFloat(pos.value); buildRamp();};
    x.onclick=()=>{ if(C().stops.length>2){ C().stops.splice(i,1); buildRamp(); renderStops(); refreshSummaries(); } };
    r.append(col,pos,x); box.appendChild(r);
  });
}

/* ---------- randomise (respects locks) ---------- */
const randHex=()=>"#"+[0,0,0].map(()=>((Math.random()*256)|0).toString(16).padStart(2,"0")).join("");
const pick=a=>a[(Math.random()*a.length)|0];
function randomize(){
  if(!locks.type){ patch(T(), pick(Object.values(WEAVES)));
    T().size=Math.round(14+Math.random()*Math.random()*70); T().weight=pick([300,500,700,800,900]); }
  if(!locks.motion){ const m=M();
    m.engine=pick(Object.keys(ENGINES)); m.speed=+((.05+Math.random()*.4)*(Math.random()<.25?-1:1)).toFixed(2);
    m.scale=+(.4+Math.random()*2).toFixed(2); m.angle=Math.round(Math.random()*360);
    m.warp=Math.random()<.45?+(Math.random()*.7).toFixed(2):0;
    m.turb=+(.3+Math.random()*1.2).toFixed(2); m.arms=1+((Math.random()*5)|0); m.count=1+((Math.random()*7)|0);
    m.shape=pick(["linear","linear","smooth","mirror","steps"]); m.shapeAmt=2+((Math.random()*8)|0); }
  if(!locks.color){ const c=C();
    // Array.from's callback gets (element, index) only — there is no third array
    // argument, so the old `a.length` threw and aborted the rest of randomize()
    // whenever this branch was taken. Count the stops up front instead.
    c.stops = Math.random()<.6 ? pick(Object.values(PALETTES)).map(s=>({...s}))
      : (ns=>Array.from({length:ns},(_,i)=>({p:ns>1?i/(ns-1):0,c:randHex()})))(2+((Math.random()*3)|0));
    c.posterize = Math.random()<.3 ? 2+((Math.random()*6)|0) : 1;
    c.hueDrift = Math.random()<.2 ? pick([1,-1]) : 0; buildRamp(); renderStops(); }
  if(!locks.material){ const a=MA();
    a.style=pick(["fill","fill","fill","outline","duo","misprint"]);
    a.blend=pick(["source-over","source-over","lighter","screen","overlay"]);
    a.glow=Math.random()<.3?((Math.random()*14)|0):0; a.layers=pick([1,1,2,3]); a.depth=+(Math.random()*.6).toFixed(2); }
  if(!locks.mask){ const k=MK(); k.on=Math.random()<.4;
    k.threshold=+(.3+Math.random()*.4).toFixed(2); k.softness=+(.05+Math.random()*.3).toFixed(2);
    k.src=pick(["same","same","second","vignette"]); k.sizeMod=Math.random()<.5?+(Math.random()*.7).toFixed(2):0; }
  if(!locks.comp){ const p=CP();
    p.grain=Math.random()<.4?+(Math.random()*.3).toFixed(2):0;
    p.vignette=Math.random()<.5?+(Math.random()*.5).toFixed(2):0; }
  [...looksEl.children].forEach(c=>c.setAttribute("aria-pressed","false"));
  layoutDirty=true; vgrad=null; syncAll(); saveDebounced();
}

const eb=document.createElement("div"); eb.className="body";
eb.innerHTML=`
  <div class="grid3">
    <button class="b" id="b_play"></button>
    <button class="b" id="b_rand">${svg("dice")}אקראי</button>
    <button class="b solid" id="b_png">${svg("down")}PNG</button>
  </div>
  <div class="lab">וידאו</div>
  <div class="r"><label for="e_len">אורך</label>
    <select id="e_len"><option value="loop">לופ מלא</option><option value="2">×2 לופים</option>
      <option value="3">3 שניות</option><option value="6">6 שניות</option><option value="10">10 שניות</option></select></div>
  <div class="r"><label for="e_vfmt">פורמט</label>
    <select id="e_vfmt"><option value="mp4">MP4 (H.264)</option><option value="webm">WebM (VP9)</option></select></div>
  <div class="r"><label for="e_scale">רזולוציית PNG</label>
    <select id="e_scale"><option value="1">1× (1080)</option><option value="2">2× (2160)</option></select></div>
  <button class="b rec" id="b_rec" style="width:100%;margin-block-start:8px">${svg("rec")}הקלט וידאו</button>
  <div class="lab">הגדרות</div>
  <div class="grid2">
    <button class="b" id="b_copy">${svg("copy")}העתק</button>
    <button class="b" id="b_load">טען</button>
  </div>
  <textarea id="e_json" spellcheck="false" aria-label="JSON הגדרות"></textarea>
  <div class="note"><kbd>רווח</kbd> הפעל/עצור · <kbd>S</kbd> PNG · <kbd>R</kbd> אקראי · <kbd>1</kbd>/<kbd>2</kbd> פורמט<br>
  הלופ נסגר בדיוק על מחזור אחד — כל המנועים מחזוריים בזמן.</div>`;
exp.appendChild(eb); secWrap.appendChild(exp);

const $=id=>document.getElementById(id);
function playIcon(){ $("b_play").innerHTML = svg(playing?"pause":"play") + (playing?"עצור":"הפעל"); }
$("b_play").onclick=()=>{ playing=!playing; playIcon(); }; playIcon();
$("b_rand").onclick=randomize;

function download(blob,name){
  if(!blob) return;
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }

$("b_png").onclick=()=>{
  const sc=parseInt($("e_scale").value,10);
  exporting=true;
  if(sc!==1){ K=sc; setupCanvases(); }
  drawFrame(clock);
  cv.toBlob(b=>{
    download(b,`gradient-${ST.format}-${stamp()}.png`);
    if(sc!==1){ K=1; setupCanvases(); }
    exporting=false;
  },"image/png");
};

let rec=null, recT=0;
$("b_rec").onclick=()=>{
  if(rec){ rec.stop(); return; }
  const sel=$("e_len").value, ls=loopSecs();
  let dur = sel==="loop" ? (ls||5) : sel==="2" ? (ls||5)*2 : parseFloat(sel);
  dur=Math.min(30,Math.max(.6,dur));
  const MP4=["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4"],
        WEBM=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  const ok=m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m);
  const want=$("e_vfmt").value==="mp4" ? MP4 : WEBM;
  // asked-for container first, the other one only if this browser cannot do it
  const mime=want.find(ok) || [...MP4,...WEBM].find(ok);
  if(!mime){ alert("הדפדפן לא תומך בהקלטת וידאו"); return; }
  const ext=mime.startsWith("video/mp4") ? "mp4" : "webm";
  if(ext!==$("e_vfmt").value) $("e_vfmt").value=ext;   // tell the truth about what came out
  const chunks=[];
  rec=new MediaRecorder(cv.captureStream(60),{mimeType:mime,videoBitsPerSecond:20e6});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    download(new Blob(chunks,{type:mime}),`gradient-${ST.format}-${stamp()}.${ext}`);
    rec=null; clearInterval(recT);
    $("recdot").style.display="none"; $("b_rec").innerHTML=svg("rec")+"הקלט וידאו"; $("b_rec").classList.add("rec");
  };
  if(!playing){ playing=true; playIcon(); }
  rec.start();
  const t0=performance.now();
  $("recdot").style.display="flex"; $("b_rec").innerHTML=svg("stop")+"עצור הקלטה"; $("b_rec").classList.remove("rec");
  recT=setInterval(()=>{
    const el=(performance.now()-t0)/1000;
    $("rect").textContent=el.toFixed(1)+" / "+dur.toFixed(1);
    if(el>=dur && rec) rec.stop();
  },50);
};

$("b_copy").onclick=async()=>{
  const s=JSON.stringify(ST); $("e_json").value=s;
  try{ await navigator.clipboard.writeText(s); $("b_copy").innerHTML=svg("copy")+"הועתק"; }
  catch{ $("b_copy").innerHTML=svg("copy")+"בתיבה"; }
  setTimeout(()=>$("b_copy").innerHTML=svg("copy")+"העתק",1400);
};
$("b_load").onclick=()=>{
  try{
    const o=JSON.parse($("e_json").value); ST=DEF(); patch(ST,o);
    setFormat(ST.format); buildRamp(); renderStops(); layoutDirty=true; vgrad=null; syncAll();
  }catch(e){ $("b_load").textContent="JSON לא תקין"; setTimeout(()=>$("b_load").textContent="טען",1500); }
};

/* ═══════════════════════════════════════════════════════════════════
   9. PERSISTENCE + KEYS + BOOT
   ═══════════════════════════════════════════════════════════════════ */
const LSK="gradient-word-system:v2";
function persist(){ try{ localStorage.setItem(LSK, JSON.stringify(ST)); }catch{} }
let ptimer=0; const saveDebounced=()=>{ clearTimeout(ptimer); ptimer=setTimeout(persist,400); };
addEventListener("change",saveDebounced,true); addEventListener("input",saveDebounced,true);
function restore(){
  if(new URLSearchParams(location.search).has("embed")) return false;   // tiles start clean
  try{ const s=localStorage.getItem(LSK); if(!s) return false; patch(ST,JSON.parse(s)); return true; }catch{ return false; }
}

/* drag a font file straight onto the artboard */
stage.addEventListener("dragover",e=>{ e.preventDefault(); stage.style.outline="2px dashed #ffffff55"; stage.style.outlineOffset="-8px"; });
stage.addEventListener("dragleave",()=>{ stage.style.outline=""; });
stage.addEventListener("drop",async e=>{
  e.preventDefault(); stage.style.outline="";
  try{ await loadFontFile(e.dataTransfer.files[0]); }
  catch(err){ const m=document.getElementById("meta"); if(m) m.title="טעינת גופן נכשלה: "+err.message; }
});

addEventListener("keydown",e=>{
  if(/input|textarea|select/i.test(e.target.tagName)) return;
  if(e.code==="Space"){ e.preventDefault(); playing=!playing; playIcon(); }
  else if(e.key==="s"||e.key==="S") $("b_png").click();
  else if(e.key==="r"||e.key==="R") randomize();
  else if(e.key==="1") setFormat("post");
  else if(e.key==="2") setFormat("story");
});

/* -- embed mode ---------------------------------------------------------------
   The composition page loads this file in a hidden frame per tile. Top-level `let`
   bindings (clock, playing) are lexical, not properties of window, so a parent frame
   cannot reach them - the page has to publish what it wants driven from outside. */
const EMBED = new URLSearchParams(location.search).has("embed");
if(EMBED){
  // hide the panel, never remove it: the boot sequence still writes into controls that
  // live inside it (playIcon, exsum), and a detached node turns those into null crashes
  const p=document.getElementById("panel"); if(p) p.style.display="none";
  const st=document.getElementById("stage");
  if(st){ st.style.padding="0"; st.style.background="none"; }
  document.body.style.gridTemplateColumns="1fr";
  const m=document.getElementById("meta"), f=document.getElementById("fps");
  if(m) m.style.display="none";
  if(f) f.style.display="none";
  playing=false;                                   // the parent owns the clock
  window.TILE={
    canvas:cv,
    setConfig(o){ ST=DEF(); patch(ST,o||{}); setFormat(ST.format);
                  buildRamp(); layoutDirty=true; vgrad=null; lkey=""; },
    draw(t){ drawFrame(t); },
    /* A tile is drawn into a cell a fraction of the sheet, so rendering it at the full
       1080-wide format is wasted work — four of those per frame is what makes the
       composition page crawl. K already exists for export upscaling; it scales down too. */
    setScale(k){ K=Math.max(.2,Math.min(2,k)); setupCanvases(); layoutDirty=true; lkey=""; },
    size(){ return [RW,RH]; },
    loopSeconds(){ return loopSecs(); },
    randomize(){ randomize(); },
    config(){ return JSON.parse(JSON.stringify(ST)); }
  };
}

restore();
setFormat(ST.format);
buildRamp(); renderStops(); syncAll(); playIcon();
$("exsum").textContent = FORMATS[ST.format].l;
</script>

<script>
/* A code on a static page is a curtain, not a lock: this whole file reaches the visitor's
   browser, so anyone who opens the source walks straight past it. It keeps passers-by out,
   and that is all it does. One key for both tools, so the code is asked once. */
(function(){
  var CODE="1111", KEY="risomitus.entered";
  var gate=document.getElementById("gate"), inp=document.getElementById("code"),
      btn=document.getElementById("enter"), msg=document.getElementById("gatemsg"),
      card=document.getElementById("gatecard");
  function open(){
    gate.classList.add("open"); document.body.classList.add("unlocked");
    try{ localStorage.setItem(KEY,"1"); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  }
  function tryCode(){
    if(inp.value.trim()===CODE){ open(); return; }
    msg.textContent="קוד שגוי";
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    inp.select();
  }
  btn.addEventListener("click",tryCode);
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter") tryCode(); });
  inp.addEventListener("input",function(){ msg.textContent=""; if(inp.value.trim()===CODE) tryCode(); });
  var seen=false; try{ seen=localStorage.getItem(KEY)==="1"; }catch(e){}
  if(seen) open(); else setTimeout(function(){ inp.focus(); },60);
})();
</script>
